<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient (Obsidian to Deep Navy) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#0F1D36"/>
    </linearGradient>

    <!-- Document Gradient: Pure White to Ice Slate -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Primary BPS Blue Gradient -->
    <linearGradient id="bpsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Electric Cyan Scan Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter for Laser -->
    <filter id="laserGlow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Minimalist Viewfinder / Scanner Alignment Corners -->
  <path d="M72 120 V76 H116" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M440 120 V76 H396" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M72 392 V436 H116" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M440 392 V436 H396" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Central Iconic Mark: Geometric Survey Document & Negative Space "P" -->
  <g filter="url(#dropShadow)">
    <!-- UPPER HALF OF DOCUMENT: Forms the Loop of Letter 'P' with 45° Corner Fold -->
    <path d="M148 108 C148 97 157 88 168 88 H300 L364 152 V232 H148 V108 Z" fill="url(#docGrad)"/>
    
    <!-- Geometric 45° Top-Right Page Fold -->
    <path d="M300 88 V144 C300 148.4 303.6 152 308 152 H364 Z" fill="url(#foldGrad)"/>

    <!-- Negative Space Counter inside 'P' loop (Aperture / Survey Box) -->
    <rect x="196" y="128" width="84" height="68" rx="10" fill="#0A1324"/>
    <!-- Subtle Inner Data Accent inside 'P' -->
    <rect x="210" y="146" width="38" height="6" rx="3" fill="#38BDF8" opacity="0.8"/>
    <rect x="210" y="162" width="56" height="6" rx="3" fill="#64748B" opacity="0.5"/>

    <!-- LOWER HALF OF DOCUMENT: Forms the Stem & Verification Checkmark (✓) -->
    <path d="M148 260 H364 V384 C364 395 355 404 344 404 H168 C157 404 148 395 148 384 V260 Z" fill="url(#docGrad)"/>

    <!-- Geometric Verification Checkmark (✓) Cutout in Lower Body -->
    <!-- Integrated checkmark representing "Periksa" (Verified & Valid) -->
    <path d="M228 328 L262 362 L326 298" stroke="url(#bpsBlue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Survey Roster Grid Marker Bars (Clean & Minimal) -->
    <rect x="180" y="302" width="28" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
    <rect x="180" y="324" width="28" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
    <rect x="180" y="346" width="28" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
  </g>

  <!-- Razor-Sharp Negative Space Optical Scan Line (The Laser Beam Slice) -->
  <g filter="url(#laserGlow)">
    <!-- Horizontal Laser Line cutting through the 28px negative space gap (Y: 246) -->
    <line x1="112" y1="246" x2="400" y2="246" stroke="url(#scanBeam)" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="246" x2="380" y2="246" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Optical Laser Sensor Focus Node (Active Scanning Reticle) -->
    <circle cx="376" cy="246" r="8" fill="#00F0FF"/>
    <circle cx="376" cy="246" r="3.5" fill="#FFFFFF"/>
    
    <!-- Left Origin Sensor Node -->
    <circle cx="136" cy="246" r="5" fill="#38BDF8"/>
    <circle cx="136" cy="246" r="2" fill="#FFFFFF"/>
  </g>
</svg>

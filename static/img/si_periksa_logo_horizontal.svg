<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Scan Laser Beam Gradient -->
    <linearGradient id="hScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="hDoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="hBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hLaserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="760" height="160" rx="20" fill="url(#hBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Left: Minimalist 120x120 Geometric Logomark Group (Monogram P for PindaiSurvei) -->
  <g transform="translate(24, 20)">
    <!-- Squircle Frame -->
    <rect width="120" height="120" rx="28" fill="#0B172E" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Corner Brackets -->
    <path d="M14 30 V14 H30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M106 30 V14 H90" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M14 90 V106 H30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M106 90 V106 H90" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Upper Document / 'P' Loop -->
    <path d="M34 24 H76 L90 38 V56 H34 V24 Z" fill="url(#hDoc)"/>
    <path d="M76 24 V38 H90 Z" fill="#94A3B8"/>
    <!-- Negative Space 'P' Counter -->
    <rect x="46" y="32" width="22" height="16" rx="3" fill="#0B172E"/>

    <!-- Lower Document / Checkmark Base -->
    <path d="M34 66 H90 V96 H34 V66 Z" fill="url(#hDoc)"/>
    <!-- Checkmark (✓) -->
    <path d="M54 81 L62 89 L78 73" stroke="url(#hBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Laser Slice -->
    <g filter="url(#hLaserGlow)">
      <line x1="22" y1="61" x2="98" y2="61" stroke="url(#hScan)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="92" cy="61" r="3" fill="#00F0FF"/>
      <circle cx="28" cy="61" r="2" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Right: Bold Typographic Lockup for 'PindaiSurvei' -->
  <g transform="translate(172, 40)">
    <!-- Main Wordmark: Bold Geometric Sans -->
    <text x="0" y="46" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#38BDF8">Pindai</tspan><tspan fill="#FFFFFF">Survei</tspan>
    </text>

    <!-- Version Pill -->
    <g transform="translate(286, 18)">
      <rect width="52" height="22" rx="11" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">v2.0</text>
    </g>

    <!-- Subtitle: Spaced, Authoritative Sans-Serif -->
    <text x="0" y="76" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.14em">
      SISTEM DIGITALISASI &amp; VERIFIKASI SURVEI BPS
    </text>

    <!-- Agency Tagline -->
    <text x="0" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" letter-spacing="0.04em">
      Badan Pusat Statistik · BPS Kab. Penajam Paser Utara
    </text>
  </g>
</svg>
